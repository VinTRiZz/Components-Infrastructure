; ========== COMMON RULES ==========
; SECTIONS:
; system    | main group about a component (name, depends, etc.)
; switches  | group with subgroups, every subgroup is name of a key.
;           | Every subgroup of switches will be transformed into
;           | CMake variable like switches.mySwitch --> COMPONENTS_SW_mySwitch
; =========== ========= ============

; ====== SWITCH FIELD RULES ========
; [switches.tests_enabled]
; default | Default state - can be ON / OFF / none, none means it's set by parent
; depends | List of depends, same as in system section, but added if switch is in ON state
; depends-components | List in Name1,Name2, etc. Will be translated into Components-Name
; sources | Sources list, that must be removed by switch if it's disabled
; precompiled | Headers to precompile, relative from repo root path
; includes | Include directories, added as PUBLIC if switch is enabled; may contain CMake variables
; =========== ========= ============

; [REQUIRED] Main information of a component
[system]
; Name of a component (for example, Components-CMake)
name =
; Depend names (such as OpenSSL, Boost::Thread, etc.)
depends =
; List in Name1,Name2, etc. Will be translated into Components-Name
depends-components =
; Version string, for example "1.5.12"
version =
; Independent headers to precompile, relative from repo root path
precompiled =

; [REQUIRED] Default switch for tests (COMPONENTS_ENABLE_TESTS)
[switches.tests_enabled]
default = none
depends =
depends-components =
sources =
precompiled =
includes =

; [REQUIRED] Default switch for Qt (COMPONENTS_IS_ENABLED_QT)
[switches.qt_enabled]
default = none
depends =
depends-components =
sources =
precompiled =
includes =

